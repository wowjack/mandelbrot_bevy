[package]
name = "mandelbrot_bevy"
version = "0.1.0"
edition = "2024"
authors = ["Jack Kingham <wowknead@gmail.com>"]
description = "Interactive render of the mandelbrot set."
repository = "https://github.com/wowjack/mandelbrot_bevy"



# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = {version = "0.18.1", features = ["bevy_dev_tools"]}

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.11.0"